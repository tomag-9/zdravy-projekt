name: Pull Request Checks

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        working-directory: ./backend
        run: black --check .

      - name: Check imports with isort
        working-directory: ./backend
        run: isort --check-only .

      - name: Type check with mypy
        working-directory: ./backend
        run: mypy api --ignore-missing-imports

  frontend-lint:
    name: Frontend Lint
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

  backend-tests:
    name: Backend Unit Tests
    runs-on: self-hosted
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432/tcp

      # Bez Redisu spadne `CACHES` na LocMem a cachovanie `/admin/celky/` ticho
      # nefunguje — testy k nemu potom padajú na niečom, čo v produkcii nie je.
      # Prostredie testov má sedieť s produkciou, kde Redis beží.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379/tcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Tento job beží priamo na runneri, nie v image z Dockerfile. WeasyPrint
      # (gramáž PDF) je tenká väzba nad Pangom — import prejde aj bez neho, ale
      # prvý render spadne na `cannot load library 'libpango-1.0-0'`. Runner
      # preto musí mať nainštalované:
      #   libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      #   libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core
      # Krokom to nejde — `sudo` na runneri žiada heslo.
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: app.settings.dev
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}
        run: |
          pytest --cov=api --cov=app --cov-config=.coveragerc --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Test contract migrations
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: app.settings.dev
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}
        run: |
          pytest --migrations --create-db -m migration tests/test_legacy_contract_migration.py --no-cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Test
    runs-on: self-hosted
    needs: [backend-lint, frontend-lint, backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: zdravy-projekt-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: zdravy-projekt-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
